<!DOCTYPE html><html lang='zh'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>匠心试炼</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#87CEEB,#D4F0F7);font-family:'Microsoft YaHei',sans-serif;color:#2c3e50}
.card{text-align:center;padding:44px 36px;background:rgba(255,255,255,.92);border:3px solid #FFB347;border-radius:24px;box-shadow:0 12px 40px rgba(0,100,150,.2);max-width:430px;width:90%}
h1{font-size:28px;letter-spacing:.2em;margin-bottom:8px;color:#FF8C42}
.sub{color:#5a7a8a;font-size:14px;margin-bottom:22px}
.btn{display:inline-block;padding:15px 44px;font-size:18px;font-weight:700;background:linear-gradient(180deg,#FFB347,#FF8C42);color:#fff;border:none;border-radius:14px;cursor:pointer;text-decoration:none;box-shadow:0 6px 16px rgba(255,140,66,.4)}
.state{margin-top:11px;font-size:12px;color:#8aa7b5;min-height:16px}
.ver{margin-top:4px;font-size:12px;color:#8aa7b5;letter-spacing:.05em}
.tips{margin-top:14px;font-size:12px;color:#7a9aab;line-height:1.85}
.tips b{color:#FF8C42}
</style></head><body><div class='card'>
<h1>🏝️ 匠心试炼</h1>
<div class='sub'>工科闯关冒险 · 六大学科实验室</div>
<a class='btn' id='go' href='./game.html'>开始冒险</a>
<div class='state' id='note'>正在选择最快的通道…</div>
<div class='ver'>v14 · 2026-11-26</div>
<div class='tips'>这个地址固定不变，<b>永远指向最新版</b>，存进收藏夹就行<br>测试账号 <b>007</b> 可直接体验全部关卡<br>首次加载约 29MB，请稍候</div>
</div>
<script>
/* 进页面先探一下 CDN 加速通道：还在就把按钮指过去（秒开）；
   不在（过期 403）就留在 ./game.html —— 那份文件永远是最新版，只是首屏慢些。 */
(function(){
  var CDN = "https://aka.doubaocdn.com/s/xXQehRNsGY";
  var go = document.getElementById('go'), note = document.getElementById('note');
  if(!go || !window.fetch){ note.textContent = '稳定通道（GitHub），首次加载稍慢'; return; }
  var done = false;
  var ctl = ('AbortController' in window) ? new AbortController() : null;
  var timer = setTimeout(function(){
    if(done) return; done = true;
    if(ctl) try{ ctl.abort(); }catch(e){}
    note.textContent = '加速通道响应慢，走稳定通道';
  }, 5000);
  fetch(CDN, {headers: {Range: 'bytes=0-0'}, signal: ctl ? ctl.signal : undefined})
    .then(function(r){
      if(done) return; done = true; clearTimeout(timer);
      if(r.ok || r.status === 206 || r.status === 416){
        go.href = CDN;
        note.textContent = '已连上加速通道 · 秒开';
        note.style.color = '#2e9c78';
      } else {
        note.textContent = '加速通道已过期，走稳定通道（永远最新）';
      }
    })
    .catch(function(){
      if(done) return; done = true; clearTimeout(timer);
      note.textContent = '加速通道不可用，走稳定通道（永远最新）';
    });
})();
</script>
</body></html>
